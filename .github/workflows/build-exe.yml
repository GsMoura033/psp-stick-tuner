name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PSP-Stick-Tuner
          --icon assets/icon.ico
          app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Stick-Tuner-windows
          path: dist/PSP-Stick-Tuner.exe

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PSP-Stick-Tuner.exe
          generate_release_notes: true
          body: |
            ## PSP Stick Tuner
            Calibrador do joystick USB (ZMK) por [Gustavo Moura](https://gsmoura.com.br).

            1. Baixe `PSP-Stick-Tuner.exe`
            2. Flash o firmware em [zmk-analog-rp2040](https://github.com/GsMoura033/zmk-analog-rp2040)
            3. USB → Detectar → calibrar → Salvar
